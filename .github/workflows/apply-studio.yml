# Edits published from /studio arrive as incoming/edit-*.studio — this applies them to content.json.
name: Apply studio edits
on:
  push:
    branches: [main]
    paths: ["incoming/*.studio"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: media-import
  cancel-in-progress: false
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Apply
        id: apply
        run: python3 scripts/apply_studio.py || echo "failed=1" >> "$GITHUB_OUTPUT"
      - name: Commit
        run: |
          git config user.name "portfolio-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A content.json index.html incoming
          git diff --cached --quiet && { echo "nothing to commit"; exit 0; }
          git commit -m "Apply studio edits"
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Report
        if: steps.apply.outputs.failed == '1'
        run: |
          echo "::error::A studio file could not be read. Nothing was changed from it."
          exit 1
