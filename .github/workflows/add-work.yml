# Drop an .mp4/.mov into incoming/ on GitHub → this turns it into a finished work on the site.
name: Add new work
on:
  push:
    branches: [main]
    paths: ["incoming/**", "!incoming/*.studio", "!incoming/README.md"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: media-import
  cancel-in-progress: false
jobs:
  add:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }
      - name: Install tools
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install --quiet pillow numpy
      - name: Process incoming videos
        run: |
          shopt -s nullglob nocaseglob
          files=(incoming/*.mp4 incoming/*.mov incoming/*.m4v incoming/*.mkv incoming/*.webm)
          [ ${#files[@]} -eq 0 ] && { echo "no videos in incoming/"; exit 0; }
          python3 scripts/process.py "${files[@]}"
          git rm -q --cached "${files[@]}" || true
          rm -f "${files[@]}"
      - name: Commit
        run: |
          git config user.name "portfolio-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for p in media content.json curation scripts/imported.json incoming; do if [ -e "$p" ]; then git add -A "$p"; fi; done
          git diff --cached --quiet && { echo "nothing new"; exit 0; }
          git commit -m "Add new work from incoming/"
          git pull --rebase origin main
          git push origin HEAD:main
